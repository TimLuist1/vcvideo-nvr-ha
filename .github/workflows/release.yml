name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          manifest_version=$(python -c "import json; print(json.load(open('custom_components/vcvideo_nvr/manifest.json'))['version'])")
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version}" >&2
            exit 1
          fi

      - name: Extract the release notes for this tag
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          title=$(grep -m1 -E "^## ${GITHUB_REF_NAME}([^0-9.]|$)" CHANGELOG.md | sed 's/^## //')
          echo "title=${title:-$GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${title}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${title}" --generate-notes
          fi
