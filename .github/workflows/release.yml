name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.1.0. Created on the default branch if it does not exist yet."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        run: echo "TAG=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Check the tag matches the manifest version
        run: |
          manifest_version=$(python -c "import json; print(json.load(open('custom_components/vcvideo_nvr/manifest.json'))['version'])")
          if [ "v${manifest_version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match manifest version ${manifest_version}" >&2
            exit 1
          fi

      - name: Extract the release notes for this tag
        run: |
          awk -v tag="${TAG}" '
            $0 ~ "^## " tag "([^0-9.]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          title=$(grep -m1 -E "^## ${TAG}([^0-9.]|$)" CHANGELOG.md | sed 's/^## //')
          echo "TITLE=${title:-$TAG}" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "${TAG}" --target "${GITHUB_SHA}" \
              --title "${TITLE}" --notes-file release-notes.md
          else
            gh release create "${TAG}" --target "${GITHUB_SHA}" \
              --title "${TITLE}" --generate-notes
          fi
